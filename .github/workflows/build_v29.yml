name: Build Release AAB & APK (v32)
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # 0. تطبيق أيقونة التطبيق الجديدة تلقائياً (mipmap)
      - name: Apply New App Icons (mipmap)
        run: |
          ICON_ZIP=$(ls sakina_new_icons_mipmap*.zip 2>/dev/null | head -n 1)
          if [ -n "$ICON_ZIP" ] && [ -f "$ICON_ZIP" ]; then
            rm -f app/src/main/res/mipmap-*/ic_launcher*
            unzip -o "$ICON_ZIP" "mipmap-*" -d app/src/main/res/
            echo "Applied new app icons from $ICON_ZIP"
          fi

      # 0.5. إضافة تبعيات Jetpack Media3 + WorkManager وتسجيل خدمة التلاوة تلقائياً
      - name: Configure Jetpack Media3 & WorkManager in Gradle & AndroidManifest
        run: |
          python3 - << 'EOF'
          import os, re

          for gpath in ["app/build.gradle.kts", "app/build.gradle"]:
              if os.path.exists(gpath):
                  txt = open(gpath, "r", encoding="utf-8").read()
                  is_kts = gpath.endswith(".kts")
                  additions = []
                  if "media3-exoplayer" not in txt:
                      additions += [
                          '    implementation("androidx.media3:media3-exoplayer:1.5.1")' if is_kts else "    implementation 'androidx.media3:media3-exoplayer:1.5.1'",
                          '    implementation("androidx.media3:media3-session:1.5.1")' if is_kts else "    implementation 'androidx.media3:media3-session:1.5.1'",
                          '    implementation("androidx.media3:media3-common:1.5.1")' if is_kts else "    implementation 'androidx.media3:media3-common:1.5.1'",
                      ]
                  if "work-runtime-ktx" not in txt:
                      additions.append(
                          '    implementation("androidx.work:work-runtime-ktx:2.9.1")' if is_kts else "    implementation 'androidx.work:work-runtime-ktx:2.9.1'"
                      )
                  if additions:
                      m = re.search(r"dependencies\s*\{", txt)
                      if m:
                          idx = m.end()
                          block = "\n    // v32: Jetpack Media3 + WorkManager\n" + "\n".join(additions) + "\n"
                          txt = txt[:idx] + block + txt[idx:]
                          open(gpath, "w", encoding="utf-8").write(txt)
                          print(f"Updated dependencies in {gpath}")
                  break

          mpath = "app/src/main/AndroidManifest.xml"
          if os.path.exists(mpath):
              mtxt = open(mpath, "r", encoding="utf-8").read()
              if "SakinaQuranPlaybackService" not in mtxt:
                  svc = (
                      '        <service\n'
                      '            android:name=".SakinaQuranPlaybackService"\n'
                      '            android:exported="true"\n'
                      '            android:foregroundServiceType="mediaPlayback">\n'
                      '            <intent-filter>\n'
                      '                <action android:name="androidx.media3.session.MediaSessionService"/>\n'
                      '            </intent-filter>\n'
                      '        </service>\n\n'
                      '    </application>'
                  )
                  mtxt = mtxt.replace("    </application>", svc, 1)
                  if "</application>" in mtxt and "SakinaQuranPlaybackService" not in mtxt:
                      mtxt = mtxt.replace("</application>", svc.replace("    </application>", "</application>"), 1)
                  open(mpath, "w", encoding="utf-8").write(mtxt)
                  print("Registered SakinaQuranPlaybackService in AndroidManifest.xml")
          EOF

      # 1. الخطوط + المصحف العثماني + فهرس التجويد المفحوص لحفص (0% انزياح) + نص ورش الصافي
      - name: Bundle Fonts, Verified Hafs Tajweed Index & Warsh Offline Text
        run: |
          rm -rf app/src/main/assets/mushaf
          mkdir -p app/src/main/res/font app/src/main/assets
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf" -o app/src/main/res/font/noto_naskh_arabic_regular.ttf
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf" -o app/src/main/res/font/noto_naskh_arabic_bold.ttf

          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/arefruqaa/ArefRuqaa-Bold.ttf" -o /tmp/aref.ttf || true
          if [ -s /tmp/aref.ttf ] && [ $(wc -c < /tmp/aref.ttf) -gt 10000 ]; then
            cp /tmp/aref.ttf app/src/main/res/font/sakina_ornate_title.ttf
          else
            cp app/src/main/res/font/noto_naskh_arabic_bold.ttf app/src/main/res/font/sakina_ornate_title.ttf
          fi

          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/plusjakartasans/static/PlusJakartaSans-Medium.ttf" -o /tmp/pjs_med.ttf || true
          curl -L -s "https://raw.githubusercontent.com/google/fonts/main/ofl/plusjakartasans/static/PlusJakartaSans-Bold.ttf" -o /tmp/pjs_bold.ttf || true
          if [ -s /tmp/pjs_med.ttf ] && [ $(wc -c < /tmp/pjs_med.ttf) -gt 10000 ] && [ -s /tmp/pjs_bold.ttf ] && [ $(wc -c < /tmp/pjs_bold.ttf) -gt 10000 ]; then
            rm -f app/src/main/res/font/c059_roman.otf app/src/main/res/font/c059_bold.otf
            cp /tmp/pjs_med.ttf app/src/main/res/font/c059_roman.ttf
            cp /tmp/pjs_bold.ttf app/src/main/res/font/c059_bold.ttf
          fi

          python3 - << 'EOF'
          import json, re, urllib.request
          from html.parser import HTMLParser

          # 1) Build exact-aligned Hafs Uthmani text + verified Tajweed rule spans from Quran.com v4
          RULE_MAP = {
              "madda_necessary": 0, "madd_6": 0,
              "madda_obligatory": 1, "madd_muttasil": 1,
              "madda_permissible": 2, "madd_munfasil": 2,
              "madda_normal": 4, "madd_2": 4, "madd_246": 3,
              "ghunnah": 5,
              "ikhafa": 6, "ikhafa_shafawi": 6, "ikhfa": 6, "ikhfa_shafawi": 6,
              "idgham_ghunnah": 7, "idgham_shafawi": 7, "idgham_mutajanisayn": 7, "idgham_mutaqaribayn": 7,
              "iqlab": 8,
              "qalaqah": 9, "qalqalah": 9,
              "idgham_wo_ghunnah": 10, "idghaam_no_ghunnah": 10,
              "ham_wasl": 11, "laam_shamsiyah": 11, "slnt": 11, "silent": 11
          }

          class TajweedHTMLParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.out = []
                  self.cur_len = 0
                  self.stack = []
                  self.spans = []
                  self.skip_depth = 0
              def handle_starttag(self, tag, attrs):
                  ad = dict(attrs)
                  cls = ad.get("class", "").strip()
                  if tag == "span" and cls == "end":
                      self.skip_depth += 1
                      return
                  if tag == "tajweed":
                      code = RULE_MAP.get(cls, -1)
                      self.stack.append((code, self.cur_len))
              def handle_endtag(self, tag):
                  if tag == "span" and self.skip_depth > 0:
                      self.skip_depth -= 1
                      return
                  if tag == "tajweed" and self.stack:
                      code, start = self.stack.pop()
                      if code >= 0 and self.cur_len > start:
                          self.spans.append([start, self.cur_len, code])
              def handle_data(self, data):
                  if self.skip_depth > 0:
                      return
                  self.out.append(data)
                  self.cur_len += len(data)

          hafs_ok = False
          try:
              req = urllib.request.Request(
                  "https://api.quran.com/api/v4/quran/verses/uthmani_tajweed",
                  headers={"User-Agent": "SakinaBuild/32"}
              )
              payload = json.loads(urllib.request.urlopen(req, timeout=45).read().decode("utf-8"))
              verses = payload.get("verses", [])
              if len(verses) == 6236:
                  hafs_grouped = {}
                  tajweed_rules = {}
                  for v in verses:
                      vk = v["verse_key"]  # e.g. "1:1"
                      s_num, a_num = vk.split(":")
                      p = TajweedHTMLParser()
                      p.feed(v.get("text_uthmani_tajweed", ""))
                      clean_txt = "".join(p.out).strip()
                      hafs_grouped.setdefault(s_num, []).append(clean_txt)
                      if p.spans:
                          tajweed_rules[vk] = p.spans
                  with open("app/src/main/assets/quran_hafs.json", "w", encoding="utf-8") as f:
                      json.dump(hafs_grouped, f, ensure_ascii=False, separators=(",", ":"))
                  with open("app/src/main/assets/quran_hafs_tajweed_rules.json", "w", encoding="utf-8") as f:
                      json.dump(tajweed_rules, f, ensure_ascii=False, separators=(",", ":"))
                  hafs_ok = True
                  print(f"Bundled exact-aligned Hafs Uthmani + {len(tajweed_rules)} Tajweed-indexed verses!")
          except Exception as e:
              print("Warning: Quran.com tajweed fetch failed, falling back to fawazahmed0:", e)

          # Fallback for Hafs + Primary for Warsh (pure Uthmani text)
          sources = {"quran_warsh.json": "https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/editions/ara-quranwarsh.min.json"}
          if not hafs_ok:
              sources["quran_hafs.json"] = "https://cdn.jsdelivr.net/gh/fawazahmed0/quran-api@1/editions/ara-quranuthmanihaf.min.json"
          for out_name, url in sources.items():
              req = urllib.request.Request(url, headers={"User-Agent": "SakinaBuild/32"})
              data = json.loads(urllib.request.urlopen(req, timeout=30).read().decode("utf-8"))
              grouped = {}
              for item in data.get("quran", []):
                  ch = str(item["chapter"])
                  grouped.setdefault(ch, []).append(f"{item['text']} ({item['verse']})")
              with open(f"app/src/main/assets/{out_name}", "w", encoding="utf-8") as f:
                  json.dump(grouped, f, ensure_ascii=False, separators=(",", ":"))
          print("Bundled Fonts, Hafs Tajweed & Warsh text successfully")
          EOF

      # 1.5. توليد دليل القراء (حفص + ورش) مع أحجام السور بالميجابايت (0ms داخل التطبيق)
      - name: Generate Reciters Catalog & Exact Surah Sizes JSON
        run: |
          python3 - << 'EOF'
          import concurrent.futures, json, urllib.request

          catalog = [
              {"id": "afasy", "nameAr": "مشاري راشد العفاسي", "nameEn": "Mishary Al-Afasy", "riwaya": "HAFS", "server": "https://server8.mp3quran.net/afs/"},
              {"id": "husary", "nameAr": "محمود خليل الحصري", "nameEn": "Mahmoud Al-Husary", "riwaya": "HAFS", "server": "https://server13.mp3quran.net/husr/"},
              {"id": "basit", "nameAr": "عبد الباسط عبد الصمد", "nameEn": "AbdulBaset AbdulSamad", "riwaya": "HAFS", "server": "https://server7.mp3quran.net/basit/"},
              {"id": "maher", "nameAr": "ماهر المعيقلي", "nameEn": "Maher Al-Muaiqly", "riwaya": "HAFS", "server": "https://server12.mp3quran.net/maher/"},
              {"id": "qazabri_warsh", "nameAr": "عمر القزابري (ورش)", "nameEn": "Omar Al-Qazabri (Warsh)", "riwaya": "WARSH", "server": "https://server9.mp3quran.net/omar_warsh/"},
              {"id": "koshi_warsh", "nameAr": "العيون الكوشي (ورش)", "nameEn": "Laayoun El Kouchi (Warsh)", "riwaya": "WARSH", "server": "https://server11.mp3quran.net/koshi/"},
              {"id": "yassin_warsh", "nameAr": "ياسين الجزائري (ورش)", "nameEn": "Yassin Al-Jazaery (Warsh)", "riwaya": "WARSH", "server": "https://server11.mp3quran.net/qari/"},
          ]

          # Live-verify server URLs from official MP3Quran API v3
          try:
              req = urllib.request.Request("https://www.mp3quran.net/api/v3/reciters?language=ar", headers={"User-Agent": "SakinaBuild/32"})
              recs = json.loads(urllib.request.urlopen(req, timeout=25).read().decode("utf-8")).get("reciters", [])
              def find_server(name_kw, want_warsh):
                  for r in recs:
                      if name_kw in r.get("name", ""):
                          for m in r.get("moshaf", []):
                              mn = m.get("name", "")
                              is_w = ("ورش" in mn)
                              if is_w == want_warsh and m.get("surah_total", 0) >= 114 and m.get("server"):
                                  return m["server"]
                  return None
              updates = [
                  ("afasy", "العفاسي", False),
                  ("husary", "الحصري", False),
                  ("basit", "عبد الباسط", False),
                  ("maher", "المعيقلي", False),
                  ("qazabri_warsh", "القزابري", True),
                  ("koshi_warsh", "الكوشي", True),
                  ("yassin_warsh", "ياسين", True),
              ]
              for cid, kw, is_w in updates:
                  srv = find_server(kw, is_w)
                  if srv:
                      for c in catalog:
                          if c["id"] == cid:
                              c["server"] = srv if srv.endswith("/") else srv + "/"
                              print(f"Verified live MP3Quran server for {cid}: {c['server']}")
          except Exception as e:
              print("Using fallback server URLs:", e)

          # Fast parallel HEAD check for exact MB sizes (first reciter per Riwaya + key reciters)
          def head_mb(url):
              try:
                  req = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "SakinaBuild/32"})
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      cl = int(resp.headers.get("Content-Length", "0"))
                      if cl > 0:
                          return round(cl / (1024 * 1024), 1)
              except Exception:
                  pass
              return 0.0

          for rec in catalog[:2] + [c for c in catalog if c["id"] == "qazabri_warsh"]:
              sizes = {}
              with concurrent.futures.ThreadPoolExecutor(max_workers=16) as ex:
                  futs = {ex.submit(head_mb, f"{rec['server']}{n:03d}.mp3"): n for n in range(1, 115)}
                  for fut, n in futs.items():
                      mb = fut.result()
                      if mb > 0:
                          sizes[str(n)] = mb
              rec["sizesMb"] = sizes
              print(f"Fetched {len(sizes)} exact MB sizes for {rec['id']}")

          with open("app/src/main/assets/quran_reciters_catalog.json", "w", encoding="utf-8") as f:
              json.dump(catalog, f, ensure_ascii=False, separators=(",", ":"))
          EOF

      # 2. ضغط الأذان إلى OGG + إثراء المؤذنين
      - name: Compress Adhan Audio & Add Extra Muezzins (OGG)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          for f in app/src/main/res/raw/*.mp3; do
            [ -f "$f" ] && ffmpeg -y -i "$f" -vn -c:a libvorbis -q:a 1 "${f%.mp3}.ogg" && rm "$f"
          done
          git clone --depth 1 https://github.com/abodehq/Athan-MP3.git /tmp/athan-mp3 || true
          python3 - << 'EOF'
          import glob, os, shutil, subprocess
          raw_dir = "app/src/main/res/raw"
          mp3s = glob.glob("/tmp/athan-mp3/**/*.mp3", recursive=True)
          def find_and_convert(target_name, keywords):
              out_ogg = os.path.join(raw_dir, f"{target_name}.ogg")
              if os.path.exists(out_ogg): return
              for m in mp3s:
                  low = os.path.basename(m).lower()
                  if any(k in low for k in keywords):
                      subprocess.run(["ffmpeg", "-y", "-i", m, "-vn", "-c:a", "libvorbis", "-q:a", "1", out_ogg], check=False)
                      if os.path.exists(out_ogg) and os.path.getsize(out_ogg) > 10000:
                          return
              fallback = os.path.join(raw_dir, "madinah.ogg")
              if os.path.exists(fallback):
                  shutil.copy(fallback, out_ogg)
          find_and_convert("makkah", ["makkah", "mecca", "haram", "mulla"])
          find_and_convert("afasy", ["afasy", "mishary", "alafasy"])
          find_and_convert("aqsa", ["aqsa", "quds", "palestine"])
          find_and_convert("aserehy", ["suraihi", "suraichi", "aserehy"])
          EOF
          rm -rf /tmp/athan-mp3

      # 3. تضمين صوتيات أذكار الصباح والمساء والنوم أوفلاين (مشاري العفاسي — OGG مضغوط)
      - name: Bundle Offline Adhkar Audio (Morning, Evening & Sleep)
        run: |
          mkdir -p app/src/main/res/raw /tmp/adhkar_dl
          BASE="https://archive.org/download/way2sona_20160320_2316"
          download_and_compress() {
            local SRC_FILE="$1"
            local OUT_NAME="$2"
            curl -L --retry 3 -s "$BASE/$SRC_FILE" -o "/tmp/adhkar_dl/$SRC_FILE" || true
            if [ -s "/tmp/adhkar_dl/$SRC_FILE" ] && [ $(wc -c < "/tmp/adhkar_dl/$SRC_FILE") -gt 50000 ]; then
              ffmpeg -y -i "/tmp/adhkar_dl/$SRC_FILE" -vn -ac 1 -ar 22050 -c:a libvorbis -q:a 0 "app/src/main/res/raw/${OUT_NAME}.ogg"
            fi
          }
          download_and_compress "athkar_03.ogg" "adhkar_sabah"
          download_and_compress "athkar_04.ogg" "adhkar_masaa"
          download_and_compress "athkar_11.ogg" "adhkar_nawm"
          rm -rf /tmp/adhkar_dl

      # 4. تضمين الفاتحة وقصار السور (الضحى–الناس، 23 سورة) أوفلاين (مشاري العفاسي — ~2.8MB OGG)
      - name: Bundle Offline Short Quran Surahs (Al-Fatiha & Ad-Duha to An-Nas)
        run: |
          mkdir -p app/src/main/res/raw /tmp/quran_dl
          PRIMARY="https://server8.mp3quran.net/afs"
          FALLBACK="https://download.quranicaudio.com/quran/mishaari_raashid_al_3afaasee"
          for NUM in 001 $(seq -f "%03g" 93 114); do
            OUT="app/src/main/res/raw/quran_s${NUM}.ogg"
            TMP="/tmp/quran_dl/${NUM}.mp3"
            curl -L --retry 2 --connect-timeout 15 -s "$PRIMARY/${NUM}.mp3" -o "$TMP" || true
            if [ ! -s "$TMP" ] || [ $(wc -c < "$TMP") -lt 10000 ]; then
              curl -L --retry 2 --connect-timeout 15 -s "$FALLBACK/${NUM}.mp3" -o "$TMP" || true
            fi
            if [ -s "$TMP" ] && [ $(wc -c < "$TMP") -gt 10000 ]; then
              ffmpeg -y -loglevel error -i "$TMP" -vn -ac 1 -ar 22050 -c:a libvorbis -q:a 0 "$OUT"
            fi
          done
          rm -rf /tmp/quran_dl

      # 5. فك تشفير مفتاح التوقيع الرسمي من GitHub Secrets
      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > /tmp/sakina-upload.jks

      # 6. بناء نسخة Google Play الموقّعة (.aab) + نسخة التجربة (.apk)
      - name: Build Signed AAB & APK
        env:
          KEYSTORE_PATH: /tmp/sakina-upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sakina-playstore-aab
          path: app/build/outputs/bundle/release/*.aab

      - uses: actions/upload-artifact@v4
        with:
          name: sakina-release-apk
          path: app/build/outputs/apk/release/*.apk
          
